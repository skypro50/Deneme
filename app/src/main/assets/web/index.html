<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>EFK Music</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand" data-action="tab" data-tab="home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48"><defs><linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1446D8"/><stop offset=".55" stop-color="#2D7CFF"/><stop offset="1" stop-color="#00D4FF"/></linearGradient></defs><circle cx="24" cy="24" r="22" fill="url(#bg-grad)"/><circle cx="24" cy="24" r="13.5" fill="none" stroke="#fff" stroke-width="2.2"/><path d="M20.5 17.5v13l10.5-6.5z" fill="#fff"/></svg>
        </span>
        <span class="brand-name">EFK <b>Music</b></span>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" data-action="tab" data-tab="search" aria-label="Ara"><svg><use href="#i-search"/></svg></button>
        <button class="icon-btn" data-action="settings" aria-label="Ayarlar"><svg><use href="#i-settings"/></svg></button>
      </div>
    </header>

    <main id="view" class="view"></main>

    <div id="mini" class="mini" hidden>
      <div class="mini-progress"><span id="mini-bar"></span></div>
      <div class="mini-body" data-action="open-player">
        <div class="mini-art"><img id="mini-art" alt=""></div>
        <div class="mini-meta">
          <div id="mini-title" class="t1"></div>
          <div id="mini-artist" class="t2"></div>
        </div>
        <button class="icon-btn" data-action="toggle" aria-label="Oynat / Duraklat"><svg id="mini-play"><use href="#i-play"/></svg></button>
        <button class="icon-btn" data-action="next" aria-label="Sonraki"><svg><use href="#i-next"/></svg></button>
      </div>
    </div>

    <nav class="tabbar">
      <button data-action="tab" data-tab="home" class="tab"><svg><use href="#i-home"/></svg><span>Ana Sayfa</span></button>
      <button data-action="tab" data-tab="search" class="tab"><svg><use href="#i-explore"/></svg><span>Keşfet</span></button>
      <button data-action="tab" data-tab="downloads" class="tab"><svg><use href="#i-download"/></svg><span>İndirmeler</span><i id="dl-badge" class="badge" hidden></i></button>
      <button data-action="tab" data-tab="library" class="tab"><svg><use href="#i-library"/></svg><span>Kitaplık</span></button>
    </nav>

    <section id="player" class="player" aria-hidden="true">
      <div class="player-bg" id="player-bg"></div>
      <div class="player-inner">
        <div class="player-top">
          <button class="icon-btn" data-action="close-player" aria-label="Kapat"><svg><use href="#i-down"/></svg></button>
          <div class="player-tabs">
            <button class="ptab active" data-action="ptab" data-ptab="song">Şarkı</button>
            <button class="ptab" data-action="ptab" data-ptab="queue">Sıradaki</button>
          </div>
          <button class="icon-btn" data-action="player-more" aria-label="Diğer"><svg><use href="#i-more"/></svg></button>
        </div>
        <div class="player-song" id="player-song">
          <div class="player-art"><img id="p-art" alt=""><div class="art-fallback" id="p-art-fallback"><svg><use href="#i-note"/></svg></div></div>
          <div class="player-meta">
            <div class="pm-text">
              <div id="p-title" class="p-title"></div>
              <div id="p-artist" class="p-artist"></div>
            </div>
            <button class="icon-btn like" data-action="fav-current" aria-label="Beğen"><svg id="p-fav"><use href="#i-heart-o"/></svg></button>
          </div>
          <div class="seek">
            <input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Konum">
            <div class="seek-times"><span id="p-pos">0:00</span><span id="p-dur">0:00</span></div>
          </div>
          <div class="controls">
            <button class="icon-btn ctl" data-action="shuffle" aria-label="Karıştır"><svg id="p-shuffle"><use href="#i-shuffle"/></svg></button>
            <button class="icon-btn ctl big" data-action="prev" aria-label="Önceki"><svg><use href="#i-prev"/></svg></button>
            <button class="play-btn" data-action="toggle" aria-label="Oynat / Duraklat"><svg id="p-play"><use href="#i-play"/></svg></button>
            <button class="icon-btn ctl big" data-action="next" aria-label="Sonraki"><svg><use href="#i-next"/></svg></button>
            <button class="icon-btn ctl" data-action="repeat" aria-label="Tekrarla"><svg id="p-repeat"><use href="#i-repeat"/></svg></button>
          </div>
          <div class="offline-pill"><svg><use href="#i-offline"/></svg> Çevrimdışı çalıyor · internet harcamaz</div>
        </div>
        <div class="player-queue" id="player-queue" hidden></div>
      </div>
    </section>

    <div id="scrim" class="scrim" data-action="close-sheet" hidden></div>
    <div id="sheet" class="sheet" hidden></div>
    <div id="toast" class="toast" hidden></div>
  </div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></symbol>
    <symbol id="i-explore" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16zm-5.5-2.5 7.51-3.49L17.5 6.5 9.99 9.99 6.5 17.5zm5.5-6.6a1.1 1.1 0 1 1 0 2.2 1.1 1.1 0 0 1 0-2.2z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></symbol>
    <symbol id="i-library" viewBox="0 0 24 24"><path d="M20 2H8a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zm-2 5h-3v5.5a2.5 2.5 0 1 1-2.5-2.5c.57 0 1.08.19 1.5.51V5h4v2zM4 6H2v14a2 2 0 0 0 2 2h14v-2H4V6z"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.14v13.72a1 1 0 0 0 1.52.85l10.78-6.86a1 1 0 0 0 0-1.7L9.52 4.29A1 1 0 0 0 8 5.14z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zm6.5 0H17v14h-3.5z"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></symbol>
    <symbol id="i-repeat-one" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4zm-4-2V9h-1l-2 1v1h1.5v4H13z"/></symbol>

    <symbol id="i-heart" viewBox="0 0 24 24"><path d="m12 21.35-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></symbol>
    <symbol id="i-heart-o" viewBox="0 0 24 24"><path d="M16.5 3c-1.74 0-3.41.81-4.5 2.09C10.91 3.81 9.24 3 7.5 3 4.42 3 2 5.42 2 8.5c0 3.78 3.4 6.86 8.55 11.54L12 21.35l1.45-1.32C18.6 15.36 22 12.28 22 8.5 22 5.42 19.58 3 16.5 3zm-4.4 15.55-.1.1-.1-.1C7.14 14.24 4 11.39 4 8.5 4 6.5 5.5 5 7.5 5c1.54 0 3.04.99 3.57 2.36h1.87C13.46 5.99 14.96 5 16.5 5c2 0 3.5 1.5 3.5 3.5 0 2.89-3.14 5.74-7.9 10.05z"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M16.59 8.59 12 13.17 7.41 8.59 6 10l6 6 6-6z"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></symbol>
    <symbol id="i-delete" viewBox="0 0 24 24"><path d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11A2.99 2.99 0 0 0 21 5a3 3 0 1 0-5.91.7L8.04 9.81A2.99 2.99 0 0 0 3 12a2.99 2.99 0 0 0 5.04 2.19l7.12 4.16c-.05.21-.08.43-.08.65A2.92 2.92 0 1 0 18 16.08z"/></symbol>
    <symbol id="i-paste" viewBox="0 0 24 24"><path d="M19 2h-4.18A3 3 0 0 0 12 0a3 3 0 0 0-2.82 2H5a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zm-7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm7 18H5V4h2v3h10V4h2v16z"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></symbol>

  <script src="app.js"></script>
</body>
</html>

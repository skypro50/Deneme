name: Android APK

on:
  push:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: APK derle
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: APK'ları adlandır
        run: |
          mkdir -p dist
          OUT=app/build/outputs/apk/release
          ls -la "$OUT"
          cp "$OUT/app-arm64-v8a-release.apk"   dist/EFK-Music.apk
          cp "$OUT/app-armeabi-v7a-release.apk" dist/EFK-Music-eski-telefonlar.apk
          cp "$OUT/app-universal-release.apk"   dist/EFK-Music-universal.apk
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: EFK-Music-apk
          path: dist/*.apk

      - name: GitHub Release yayınla
        if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: EFK Music 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/*.apk
          body: |
            **Telefona kurulum:** `EFK-Music.apk` dosyasına dokun → indir → aç → "Bilinmeyen kaynaklara izin ver" → Yükle.

            - `EFK-Music.apk` → 2017 sonrası telefonların neredeyse hepsi (arm64)
            - `EFK-Music-eski-telefonlar.apk` → çok eski 32-bit telefonlar
            - `EFK-Music-universal.apk` → hangisi olduğunu bilmiyorsan (daha büyük)

            Commit: ${{ github.sha }}
